name: Deploy main to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Check out pinned NexusEngine
        uses: actions/checkout@v4
        with:
          repository: LuminaryLabs-Dev/NexusEngine
          ref: c674a53e054640f5acc035180a2f3fe1d7d4fe03
          path: .engine-source

      - name: Apply pinned engine compatibility fix in temporary checkout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.engine-source/src/core-domains/authoring/domain.manifest.js')
          source = p.read_text()
          duplicate = [line for line in source.splitlines(keepends=True)
                       if line.strip().startswith("...[{domainPath:'n:authoring:design'")]
          if len(duplicate) != 1:
              raise SystemExit('Pinned engine manifest layout changed; refusing unverified patch')
          p.write_text(source.replace(duplicate[0], ''))
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install game dependencies with pinned local engine
        run: |
          cp package.json /tmp/roj-deploy-package.json
          npm pkg delete dependencies.nexusengine
          npm install --no-audit --no-fund
          cp /tmp/roj-deploy-package.json package.json
          ln -s ../.engine-source node_modules/nexusengine

      - name: Verify game
        run: npm run check

      - name: Build for repository Pages path
        run: npm run build -- --base=/Relics-of-Jotunheim/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages build
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
