name: ROJ-0004 browser validation and authentic gameplay capture
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'experiments/roj-0003/**'
      - 'assets/glb/fighter-rigged-v2.glb'
      - 'scripts/verify-browser.mjs'
      - '.github/workflows/roj-0004-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: LuminaryLabs-Dev/NexusEngine
          ref: c674a53e054640f5acc035180a2f3fe1d7d4fe03
          path: .engine-source
      - name: Patch duplicate public manifest aliases in temporary Core checkout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.engine-source/src/core-domains/authoring/domain.manifest.js')
          s=p.read_text()
          lines=[line for line in s.splitlines(keepends=True) if line.strip().startswith("...[{domainPath:'n:authoring:design'")]
          if len(lines)!=1: raise SystemExit('Unexpected manifest layout')
          p.write_text(s.replace(lines[0],''))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser and build dependencies
        run: |
          cp package.json /tmp/roj-package.json
          npm pkg delete dependencies.nexusengine
          npm install --no-audit --no-fund --no-save playwright@1.58.2
          rm -rf node_modules/nexusengine
          ln -s ../.engine-source node_modules/nexusengine
          cp /tmp/roj-package.json package.json
          npx playwright install --with-deps chromium
      - name: Validate game build
        run: |
          npm run check
          npm run build
      - name: Capture actual running third-person game
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/roj-preview.log 2>&1 &
          node scripts/verify-browser.mjs
      - name: Preserve browser gameplay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roj-0004-browser-evidence
          path: artifacts/roj-0004/browser/
          if-no-files-found: warn
          retention-days: 14
