name: ROJ-0003 native authoring proof
on:
  push:
    branches: [main]
    paths:
      - 'scripts/author-fighter-walk.mjs'
      - '.github/workflows/roj-0003-authoring.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  author-walk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: LuminaryLabs-Dev/NexusEngine
          ref: c674a53e054640f5acc035180a2f3fe1d7d4fe03
          path: .engine-source
      - name: Work around duplicate Authoring manifest export in pinned Core checkout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.engine-source/src/core-domains/authoring/domain.manifest.js')
          source=p.read_text()
          duplicate=[line for line in source.splitlines(keepends=True) if line.strip().startswith("...[{domainPath:'n:authoring:design'")]
          if len(duplicate)!=1:
              raise SystemExit('Manifest drift: expected exactly one duplicate publicEntries line')
          p.write_text(source.replace(duplicate[0],''))
          print('Removed duplicate Design/Art/Interaction/Craft publicEntries aliases in runner-local checkout; engine repo unchanged')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mount pinned NexusEngine locally
        run: |
          mkdir -p node_modules
          ln -s ../.engine-source node_modules/nexusengine
          node -p "require('./node_modules/nexusengine/package.json').version"
      - name: Run real Authoring mesh, rig, skin, walk and GLB reimport
        run: |
          node scripts/author-fighter-walk.mjs
          node scripts/author-fighter-walk.mjs --all
      - name: Upload native GLB and proof
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: roj-0003-native-walk
          path: artifacts/roj-0003/
          retention-days: 14

      - name: Commit validated prototype GLB and authoring receipts
        if: success()
        run: |
          mkdir -p assets/glb assets/source/fighter evidence/roj-0003
          cp artifacts/roj-0003/fighter-all-clips.glb assets/glb/fighter-rigged-prototype.glb
          cp artifacts/roj-0003/canonical-all-clips-source.json assets/source/fighter/canonical-source.json
          cp artifacts/roj-0003/native-all-clips-receipt.json evidence/roj-0003/native-authoring-receipt.json
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::main moved during native authoring; rejecting stale publication"
            exit 1
          fi
          git add assets/glb/fighter-rigged-prototype.glb assets/source/fighter/canonical-source.json evidence/roj-0003/native-authoring-receipt.json
          if git diff --cached --quiet; then
            echo "Existing validated artifacts match"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'assets(ROJ-0003): publish native NexusEngine rigged six-clip fighter prototype'
          git push origin HEAD:main
